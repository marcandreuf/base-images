on:
  push:
    paths:
      - "backend/dockerfile-*"
      - "frontend/dockerfile-*"
    branches:
      - "main"
  pull_request:
    paths:
      - "backend/dockerfile-*"
      - "frontend/dockerfile-*"
    branches:
      - "main"

env:
  REGISTRY: ghcr.io

jobs:
  changed-files:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # OR "2" -> To retrieve the preceding commit.

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v42
        with:
          files: |
            backend/dockerfile-*
            frontend/dockerfile-*

      - id: set-matrix
        run: |
          matrix="{\"include\":[";
          # Get list of all dockerfile patterns
          backend_files=$(find backend -name "dockerfile-*" -printf "%f\n" || echo "")
          frontend_files=$(find frontend -name "dockerfile-*" -printf "%f\n" || echo "")

          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            filename=$(basename "$file")
            dirname=$(dirname "$file")
            
            if [[ "$dirname" == "backend" || "$dirname" == "frontend" ]] && [[ "$filename" == dockerfile-* ]]; then
              # Convert dockerfile name to image name (e.g., dockerfile-alpine-base -> alpine-base)
              image_suffix=${filename#dockerfile-}
              
              # Build the matrix entry
              matrix="$matrix{\"dockerfile\":\"./${file}\",\"image\":\"ghcr.io/${{github.repository}}/${dirname}-${image_suffix}\"},"
            fi
          done;
          matrix="${matrix%,}]}";
          echo "matrix=$matrix" >> $GITHUB_OUTPUT;

  build-and-push-images:
    needs: changed-files
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.changed-files.outputs.matrix)}}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Login against a Github Container registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
