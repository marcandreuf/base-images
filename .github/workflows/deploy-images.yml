on:
  push:
    paths:
      - "backend/dockerfile-alpine-pocketbase"
      - "frontend/dockerfile-node22-pnpm"
      - "frontend/dockerfile-node22-pnpm-web-dev"
      - "frontend/dockerfile-node22-pnpm-build"
    branches:
      - "main"
  pull_request:
    paths:
      - "backend/dockerfile-alpine-pocketbase"
      - "frontend/dockerfile-node22-pnpm"
      - "frontend/dockerfile-node22-pnpm-web-dev"
      - "frontend/dockerfile-node22-pnpm-build"
    branches:
      - "main"

env:
REGISTRY: ghcr.io

jobs:
  changed-files:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v42
        with:
          files: |
            backend/dockerfile-alpine-pocketbase
            frontend/dockerfile-node22-pnpm
            frontend/dockerfile-node22-pnpm-web-dev
            frontend/dockerfile-node22-pnpm-build

      - id: set-matrix
        run: |
          matrix="{\"include\":["
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            case $file in
              "backend/dockerfile-alpine-pocketbase")
                matrix="$matrix{\"dockerfile\":\"./backend/dockerfile-alpine-pocketbase\",\"image\":\"ghcr.io/${{github.repository}}/backend-alpine-pocketbase\"},"
                ;;
              "frontend/dockerfile-node22-pnpm")
                matrix="$matrix{\"dockerfile\":\"./frontend/dockerfile-node22-pnpm\",\"image\":\"ghcr.io/${{github.repository}}/frontend-node22-pnpm\"},"
                ;;
              "frontend/dockerfile-node22-pnpm-web-dev")
                matrix="$matrix{\"dockerfile\":\"./frontend/dockerfile-node22-pnpm-web-dev\",\"image\":\"ghcr.io/${{github.repository}}/frontend-node22-pnpm-web-dev\"},"
                ;;
              "frontend/dockerfile-node22-pnpm-build")
                matrix="$matrix{\"dockerfile\":\"./frontend/dockerfile-node22-pnpm-build\",\"image\":\"ghcr.io/${{github.repository}}/frontend-node22-pnpm-build\"},"
                ;;
            esac
          done
          matrix="${matrix%,}]}"
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  build-and-push-images:
    needs: changed-files
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.changed-files.outputs.matrix)}}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Login against a Github Container registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
